<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTA Section</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN for icons -->
  <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
  />
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <!-- CTA Container -->
  <section class="w-full max-w-4xl bg-[#3AAFA9] rounded-xl p-8 md:p-10 text-center shadow-lg">
    <!-- Title -->
    <h2 class="text-2xl md:text-3xl font-bold text-white mb-3">
      Ready to Get Started?
    </h2>

    <!-- Subtitle -->
    <p class="text-white/90 text-sm md:text-base mb-8 max-w-xl mx-auto font-normal">
      Visit one of our 4 convenient locations or contact us for more information.
    </p>

    <!-- Buttons Wrapper -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 max-w-xl mx-auto">
      
      <!-- Primary Button -->
      <a 
        href="#" 
        class="w-full sm:w-1/2 bg-[#2563EB] hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2 shadow-sm"
      >
        <i class="fa-solid fa-location-dot text-sm"></i>
        <span>Find Locations</span>
      </a>

      <!-- Secondary Button -->
      <a 
        href="#" 
        class="w-full sm:w-1/2 bg-white hover:bg-gray-50 text-gray-800 font-medium py-3 px-6 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2 shadow-sm"
      >
        <i class="fa-solid fa-phone text-sm"></i>
        <span>Contact Us</span>
      </a>

    </div>
  </section>

</body>
</html>


     <!-- =========================
       BOOKING CTA
  ========================== -->
      
<section class="pricing-booking" id="booking">
  <div class="pricing-booking-content">
    <p class="section-label">READY WHEN YOU ARE</p>

    <h2>
      Let Us Take Care of
      <span>Your Laundry.</span>
    </h2>

    <p>Choose your service and book your laundry pickup today.</p>

    <div class="booking-buttons">

      <!-- Book a Pickup -->
      <a href="#" class="booking-button">
        <span class="button-icon">📅</span>
        <span>Book a Pickup</span>
      </a>

      <!-- Contact Us -->
      <a href="#contact" class="booking-button">
        <span class="button-icon">✉</span>
        <span>Contact Us</span>
      </a>

    </div>
  </div>
</section>
